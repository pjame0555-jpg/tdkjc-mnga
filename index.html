<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TDKJC MANGA - เว็บไซต์อ่านมังงะ</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212;
            color: #e0e0e0;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
            background-color: #1f1f1f;
            border-bottom: 1px solid #333;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: #ff9800;
            text-transform: uppercase;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .nav-link {
            color: #e0e0e0;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
            background: none;
            border: none;
            font-size: 1rem;
        }

        .nav-link:hover {
            color: #ff9800;
        }

        .auth-panel {
            display: flex;
            gap: 8px;
            align-items: center;
            background: #2b2b2b;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #444;
        }

        .auth-panel input {
            padding: 6px 10px;
            background-color: #1a1a1a;
            border: 1px solid #555;
            color: #fff;
            border-radius: 3px;
            font-size: 0.85rem;
            width: 140px;
        }

        .container {
            padding: 30px 5%;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .manga-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        .manga-card {
            background-color: #1f1f1f;
            border-radius: 8px;
            overflow: hidden;
            padding: 10px;
            text-align: center;
            border: 1px solid #333;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .manga-card img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            border-radius: 4px;
        }

        .manga-card h3 {
            font-size: 1rem;
            margin: 10px 0 5px;
            text-transform: uppercase;
        }

        .manga-card p {
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 10px;
        }

        .btn {
            display: inline-block;
            background-color: #ff9800;
            color: #121212;
            padding: 8px 14px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.85rem;
            border: none;
            cursor: pointer;
            text-transform: uppercase;
        }

        .btn:hover {
            background-color: #e68900;
        }

        .form-container {
            background-color: #1f1f1f;
            padding: 25px;
            border-radius: 8px;
            border: 1px solid #333;
            max-width: 600px;
            margin: 0 auto;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            background-color: #2b2b2b;
            border: 1px solid #444;
            color: #fff;
            border-radius: 4px;
        }

        .preview-box {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
        }

        .preview-box img {
            width: 80px;
            height: 100px;
            object-fit: cover;
            border-radius: 4px;
            border: 1px solid #555;
        }

        #reader-view, #add-view {
            display: none;
            min-height: 100vh;
        }

        #reader-view {
            background-color: #000;
        }

        .reader-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(31, 31, 31, 0.95);
            padding: 10px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .manga-pages {
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 800px;
            margin: 0 auto;
        }

        .manga-pages img {
            width: 100%;
            height: auto;
            display: block;
        }

        footer {
            text-align: center;
            padding: 20px;
            background-color: #1f1f1f;
            color: #666;
            margin-top: 40px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <!-- หน้าแรก -->
    <div id="home-view">
        <header>
            <div class="logo">TDKJC MANGA 📖</div>
            <nav>
                <button class="nav-link" onclick="goToHome()">หน้าแรก</button>
                <button class="nav-link" onclick="openAddPage()">เพิ่มมังงะ</button>
                
                <!-- ส่วนจัดการบัญชี -->
                <div class="auth-panel" id="logged-out-box">
                    <input type="email" id="email-input" placeholder="อีเมล...">
                    <input type="password" id="pass-input" placeholder="รหัสผ่าน...">
                    <button class="btn" onclick="handleLogin()">เข้าสู่ระบบ</button>
                    <button class="btn" style="background-color: #4CAF50; color: #fff;" onclick="handleRegister()">สมัครสมาชิก</button>
                </div>

                <div id="logged-in-box" style="display: none; align-items: center; gap: 10px;">
                    <span id="user-label" style="color: #ff9800; font-size: 0.9rem;"></span>
                    <button class="btn" style="background-color: #f44336; color: #fff;" onclick="handleLogout()">ออกจากระบบ</button>
                </div>
            </nav>
        </header>

        <main class="container">
            <div class="section-header">
                <h2>มังงะทั้งหมดบนคลาวด์</h2>
                <button class="btn" onclick="openAddPage()">+ เพิ่มมังงะ</button>
            </div>
            
            <div class="manga-grid" id="manga-grid"></div>
        </main>

        <footer>
            <p>&copy; 2026 TDKJC MANGA. ALL RIGHTS RESERVED.</p>
        </footer>
    </div>

    <!-- หน้าเพิ่มมังงะ -->
    <div id="add-view">
        <header>
            <div class="logo">TDKJC MANGA 📖</div>
            <nav>
                <button class="nav-link" onclick="goToHome()">กลับหน้าแรก</button>
            </nav>
        </header>

        <main class="container">
            <div class="form-container">
                <h2 style="margin-bottom: 20px; text-transform: uppercase;">เพิ่มมังงะเรื่องใหม่</h2>
                
                <div class="form-group">
                    <label>ชื่อเรื่องมังงะ</label>
                    <input type="text" id="manga-title" placeholder="กรอกชื่อมังงะ...">
                </div>

                <div class="form-group">
                    <label>รูปภาพปก</label>
                    <input type="file" id="cover-file-input" accept="image/*" onchange="previewCover(event)" style="background:none; border:none; padding:0;">
                    <div class="preview-box" id="cover-preview"></div>
                </div>

                <div class="form-group">
                    <label>จำนวนตอน / ข้อมูลตอน</label>
                    <input type="text" id="manga-chapter" placeholder="เช่น ตอนที่ 1">
                </div>

                <div class="form-group">
                    <label>รูปภาพเนื้อหาหน้าอ่าน (เลือกได้หลายรูป)</label>
                    <input type="file" id="pages-file-input" accept="image/*" multiple onchange="previewPages(event)" style="background:none; border:none; padding:0;">
                    <div class="preview-box" id="pages-preview"></div>
                </div>

                <button class="btn" onclick="saveMangaToCloud()">บันทึกและเผยแพร่</button>
            </div>
        </main>
    </div>

    <!-- หน้าอ่านมังงะ -->
    <div id="reader-view">
        <div class="reader-nav">
            <button class="btn" onclick="goToHome()">⬅ กลับหน้าแรก</button>
            <span id="reader-title" style="font-weight: bold; text-transform: uppercase;">TDKJC MANGA</span>
            <div></div>
        </div>
        <div class="manga-pages" id="reader-pages-container"></div>
    </div>

    <!-- ส่วนเชื่อมต่อ Firebase และฟังก์ชันการทำงานหลัก -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAqIe0iTNKcr0_4DsT9vfs5pMjca01L0AA",
            authDomain: "tdkjc-manga.firebaseapp.com",
            projectId: "tdkjc-manga",
            storageBucket: "tdkjc-manga.firebasestorage.app",
            messagingSenderId: "906069821797",
            appId: "1:906069821797:web:9d0d8eefca1bb1537ff98c",
            measurementId: "G-QK9WXJX8P5"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let tempCoverBase64 = '';
        let tempPagesBase64 = [];
        let globalMangaList = [];

        // ผูกฟังก์ชันให้เรียกใช้งานผ่าน HTML ได้โดยตรง
        window.goToHome = function() {
            document.getElementById('reader-view').style.display = 'none';
            document.getElementById('add-view').style.display = 'none';
            document.getElementById('home-view').style.display = 'block';
            loadMangasFromCloud();
            window.scrollTo(0, 0);
        }

        window.openAddPage = function() {
            let user = auth.currentUser;
            if (!user) {
                alert('กรุณาเข้าสู่ระบบก่อนเพิ่มมังงะ!');
                return;
            }
            document.getElementById('home-view').style.display = 'none';
            document.getElementById('reader-view').style.display = 'none';
            document.getElementById('add-view').style.display = 'block';
            document.getElementById('manga-title').value = '';
            document.getElementById('manga-chapter').value = '';
            document.getElementById('cover-file-input').value = '';
            document.getElementById('pages-file-input').value = '';
            document.getElementById('cover-preview').innerHTML = '';
            document.getElementById('pages-preview').innerHTML = '';
            tempCoverBase64 = '';
            tempPagesBase64 = [];
            window.scrollTo(0, 0);
        }

        // ระบบตรวจสอบสถานะล็อกอินแบบเรียลไทม์
        onAuthStateChanged(auth, (user) => {
            let loggedOutBox = document.getElementById('logged-out-box');
            let loggedInBox = document.getElementById('logged-in-box');
            let userLabel = document.getElementById('user-label');

            if (user) {
                loggedOutBox.style.display = 'none';
                loggedInBox.style.display = 'flex';
                userLabel.innerText = `ผู้ใช้: ${user.email}`;
            } else {
                loggedOutBox.style.display = 'flex';
                loggedInBox.style.display = 'none';
                userLabel.innerText = '';
            }
        });

        // สมัครสมาชิก
        window.handleRegister = async function() {
            let email = document.getElementById('email-input').value.trim();
            let password = document.getElementById('pass-input').value.trim();

            if (!email || !password) {
                alert('กรุณากรอกอีเมลและรหัสผ่าน!');
                return;
            }

            try {
                await createUserWithEmailAndPassword(auth, email, password);
                alert('สมัครสมาชิกและเข้าสู่ระบบสำเร็จ!');
            } catch (error) {
                alert('สมัครไม่สำเร็จ: ' + error.message);
            }
        }

        // เข้าสู่ระบบ
        window.handleLogin = async function() {
            let email = document.getElementById('email-input').value.trim();
            let password = document.getElementById('pass-input').value.trim();

            if (!email || !password) {
                alert('กรุณากรอกอีเมลและรหัสผ่าน!');
                return;
            }

            try {
                await signInWithEmailAndPassword(auth, email, password);
                alert('เข้าสู่ระบบสำเร็จ!');
            } catch (error) {
                alert('เข้าสู่ระบบไม่สำเร็จ: อีเมลหรือรหัสผ่านไม่ถูกต้อง');
            }
        }

        // ออกจากระบบ
        window.handleLogout = async function() {
            try {
                await signOut(auth);
                alert('ออกจากระบบเรียบร้อยแล้ว');
                goToHome();
            } catch (error) {
                alert('เกิดข้อผิดพลาด: ' + error.message);
            }
        }

        // แปลงไฟล์ภาพปกเป็น Base64
        window.previewCover = function(event) {
            let file = event.target.files[0];
            if (file) {
                let reader = new FileReader();
                reader.onload = (e) => {
                    tempCoverBase64 = e.target.result;
                    document.getElementById('cover-preview').innerHTML = `<img src="${tempCoverBase64}">`;
                };
                reader.readAsDataURL(file);
            }
        }

        // แปลงไฟล์หน้าอ่านมังงะเป็น Base64
        window.previewPages = function(event) {
            let files = event.target.files;
            let preview = document.getElementById('pages-preview');
            preview.innerHTML = '';
            tempPagesBase64 = [];

            if (files.length > 0) {
                Array.from(files).forEach(file => {
                    let reader = new FileReader();
                    reader.onload = (e) => {
                        tempPagesBase64.push(e.target.result);
                        let img = document.createElement('img');
                        img.src = e.target.result;
                        preview.appendChild(img);
                    };
                    reader.readAsDataURL(file);
                });
            }
        }

        // บันทึกข้อมูลลงฐานข้อมูล Firestore
        window.saveMangaToCloud = async function() {
            let title = document.getElementById('manga-title').value.trim();
            let chapter = document.getElementById('manga-chapter').value.trim();
            let user = auth.currentUser;

            if (!title || !tempCoverBase64) {
                alert('กรุณากรอกชื่อเรื่องและเลือกรูปภาพปก!');
                return;
            }

            try {
                await addDoc(collection(db, "mangas"), {
                    title: title,
                    cover: tempCoverBase64,
                    chapter: chapter || 'ตอนที่ 1',
                    pages: tempPagesBase64.length > 0 ? tempPagesBase64 : [tempCoverBase64],
                    author: user ? user.email : 'ไม่ระบุ',
                    createdAt: new Date()
                });

                alert('เพิ่มมังงะขึ้นระบบคลาวด์สำเร็จ!');
                goToHome();
            } catch (error) {
                alert('บันทึกไม่สำเร็จ: ' + error.message);
            }
        }

        // ดึงรายการมังงะมาแสดงหน้าแรก
        async function loadMangasFromCloud() {
            let grid = document.getElementById('manga-grid');
            grid.innerHTML = '<p style="color: #888; grid-column: 1/-1; text-align: center;">กำลังโหลดข้อมูล...</p>';
            
            try {
                let querySnapshot = await getDocs(collection(db, "mangas"));
                globalMangaList = [];
                querySnapshot.forEach((docSnap) => {
                    globalMangaList.push({ id: docSnap.id, ...docSnap.data() });
                });

                grid.innerHTML = '';
                if (globalMangaList.length === 0) {
                    grid.innerHTML = '<p style="color: #888; grid-column: 1/-1; text-align: center;">ยังไม่มีมังงะในระบบ สมัครสมาชิกแล้วกด "เพิ่มมังงะ" ได้เลย!</p>';
                    return;
                }

                globalMangaList.forEach((manga, index) => {
                    let card = document.createElement('div');
                    card.className = 'manga-card';
                    card.innerHTML = `
                        <div>
                            <img src="${manga.cover}">
                            <h3>${manga.title}</h3>
                            <p>${manga.chapter} <br><small style="color:#aaa;">ผู้อัปโหลด: ${manga.author || 'ไม่ระบุ'}</small></p>
                        </div>
                        <button class="btn" onclick="openReader(${index})">อ่านมังงะ</button>
                    `;
                    grid.appendChild(card);
                });
            } catch (error) {
                grid.innerHTML = `<p style="color: #f44336; grid-column: 1/-1; text-align: center;">โหลดข้อมูลไม่สำเร็จ: ${error.message}</p>`;
            }
        }

        window.openReader = function(index) {
            let manga = globalMangaList[index];
            document.getElementById('home-view').style.display = 'none';
            document.getElementById('add-view').style.display = 'none';
            document.getElementById('reader-view').style.display = 'block';

            document.getElementById('reader-title').innerText = `${manga.title} - ${manga.chapter}`;

            let pagesContainer = document.getElementById('reader-pages-container');
            pagesContainer.innerHTML = '';

            manga.pages.forEach(pageUrl => {
                let img = document.createElement('img');
                img.src = pageUrl;
                pagesContainer.appendChild(img);
            });

            window.scrollTo(0, 0);
        }

        // เริ่มต้นโหลดข้อมูลเมื่อเปิดหน้าเว็บ
        goToHome();
    </script>
</body>
</html>
